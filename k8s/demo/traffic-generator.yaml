apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                for path in / /api/info /env /headers; do
                  curl -s -o /dev/null -m 5 "http://demo-app-active.demo.svc.cluster.local$path"
                done
                sleep 0.2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
