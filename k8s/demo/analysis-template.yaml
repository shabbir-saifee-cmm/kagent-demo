apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: promotion-report
  namespace: demo
spec:
  args:
    - name: rollout
    - name: blue-hash
    - name: green-hash
    - name: namespace
      value: demo
    - name: bake
      value: 90s
    - name: report-url
      value: http://report-service.kagent.svc.cluster.local/report
  dryRun:
    - metricName: ".*"
  metrics:
    - name: promotion-assessment
      initialDelay: "{{args.bake}}"
      count: 1
      successCondition: result startsWith "HEALTHY"
      failureCondition: result startsWith "DEGRADED"
      provider:
        web:
          url: "{{args.report-url}}?namespace={{args.namespace}}&rollout={{args.rollout}}&blue={{args.blue-hash}}&green={{args.green-hash}}&window=10m"
          timeoutSeconds: 360
          jsonPath: "{$.assessment}"
