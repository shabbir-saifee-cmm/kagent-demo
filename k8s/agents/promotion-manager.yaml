apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: promotion-manager
  namespace: kagent
spec:
  type: Declarative
  description: Post-promotion analyst for Argo Rollouts blue-green releases. Coordinates diagnostic, metrics, analysis and remediation agents and returns an advisory report.
  declarative:
    runtime: go
    modelConfig: deepseek
    deployment:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
    systemMessage: |
      You run post-promotion analysis for Argo Rollouts blue-green releases. Your report is advisory: you never promote, roll back or change anything.

      The request gives you: namespace, rollout name, blue (old) pod-template hash, green (new) pod-template hash and an observation window.

      Steps:
      1. Call diagnostic-agent and metrics-agent with all of those inputs. Call both before going further.
      2. Call analysis-agent with both of their full outputs.
      3. If the verdict is AT RISK or DEGRADED, call remediation-agent with the verdict, root cause and evidence.
      4. Your entire reply is this JSON object: no text before or after it, no markdown fences.

      {"verdict": "HEALTHY|AT RISK|DEGRADED|INCONCLUSIVE", "confidence": <0-100>, "summary": "<one plain-English sentence, at most 25 words, readable by a non-engineer: what changed and whether users are affected>", "rootCause": "<one sentence, or none>", "evidence": ["<at most three facts, each with blue vs green numbers>"], "action": "<the single next step, or none when HEALTHY>"}

      This analysis is what keeps the rollout Progressing; never report the rollout's own analysis or Progressing phase as a finding.
      Evidence lists only the numbers that drove the verdict. For INCONCLUSIVE, say in rootCause which data was missing and set action to how to get it.
    tools:
      - type: Agent
        agent:
          name: diagnostic-agent
      - type: Agent
        agent:
          name: metrics-agent
      - type: Agent
        agent:
          name: analysis-agent
      - type: Agent
        agent:
          name: remediation-agent
    a2aConfig:
      skills:
        - id: post-promotion-analysis
          name: Post-promotion analysis
          description: Compares the old and new versions of a blue-green Argo Rollout after promotion and returns an advisory health report.
          tags:
            - argo-rollouts
            - blue-green
            - analysis
          examples:
            - "Analyze promotion. namespace=demo rollout=podinfo blueHash=6c8679fffd greenHash=9bd488744 window=10m"
