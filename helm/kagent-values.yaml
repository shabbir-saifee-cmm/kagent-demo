kagent-tools:
  rbac:
    readOnly: true
    additionalRules:
      - apiGroups: ["argoproj.io"]
        resources: ["rollouts", "analysisruns", "analysistemplates", "experiments"]
        verbs: ["get", "list", "watch"]
  otel:
    tracing:
      enabled: true
      exporter:
        otlp:
          endpoint: http://jaeger.observability.svc.cluster.local:4317
          insecure: true

config:
  telemetry:
    traces:
      endpoint: http://jaeger.observability.svc.cluster.local:4317
      protocol: grpc
  runtimeDefaults:
    cpu: "1"
    memory: 512Mi
    telemetry:
      traces:
        endpoint: http://jaeger.observability.svc.cluster.local:4317
        protocol: grpc
      captureContent: true
